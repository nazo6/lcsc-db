name: Benchmark Database Variants Size

on:
  workflow_dispatch:
    inputs:
      target_db:
        description: "Target database to benchmark"
        required: true
        type: choice
        default: "both"
        options:
          - "both"
          - "lcsc_only"
          - "jlcpcb_integrated"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install system dependencies (pigz for parallel compression)
        run: |
          sudo apt-get update
          sudo apt-get install -y pigz

      - name: Install dependencies
        run: uv sync

      - name: Download release database assets
        run: |
          TARGET="${{ github.event.inputs.target_db || 'both' }}"
          if [ "$TARGET" = "both" ] || [ "$TARGET" = "lcsc_only" ]; then
            echo "Downloading lcsc_only.sqlite3.tar.gz..."
            gh release download latest -p "lcsc_only.sqlite3.tar.gz"
            tar -I pigz -xf lcsc_only.sqlite3.tar.gz || tar -xzf lcsc_only.sqlite3.tar.gz
          fi

          if [ "$TARGET" = "both" ] || [ "$TARGET" = "jlcpcb_integrated" ]; then
            echo "Downloading lcsc.sqlite3.tar.gz..."
            gh release download latest -p "lcsc.sqlite3.tar.gz"
            tar -I pigz -xf lcsc.sqlite3.tar.gz || tar -xzf lcsc.sqlite3.tar.gz
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Benchmark DB 2 (LCSC Only Variants Size)
        if: github.event.inputs.target_db == 'both' || github.event.inputs.target_db == 'lcsc_only' || github.event.inputs.target_db == ''
        run: |
          uv run python scripts/benchmark_variants.py --db-path lcsc_only.sqlite3 --label "LCSC Only (DB 2)" --output-markdown "$GITHUB_STEP_SUMMARY"

      - name: Benchmark DB 1 (JLCPCB Integrated Variants Size)
        if: github.event.inputs.target_db == 'both' || github.event.inputs.target_db == 'jlcpcb_integrated' || github.event.inputs.target_db == ''
        run: |
          uv run python scripts/benchmark_variants.py --db-path lcsc.sqlite3 --label "JLCPCB Integrated (DB 1)" --output-markdown "$GITHUB_STEP_SUMMARY"
