name: Update LCSC Product Database

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Delay between API requests in seconds"
        required: false
        default: "2.0"
      instock_only:
        description: "Fetch in-stock products only (true/false)"
        required: false
        default: "true"

jobs:
  build-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Download existing database release asset (for cache / delta update)
        continue-on-error: true
        run: |
          gh release download latest -p "lcsc_only.sqlite3.tar.gz" || true
          if [ -f "lcsc_only.sqlite3.tar.gz" ]; then
            echo "Found existing LCSC-only database release archive. Decompressing..."
            tar -xzf lcsc_only.sqlite3.tar.gz
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "[Phase 1/2] Run LCSC Database Scraper (Generate DB 2: LCSC Only)"
        run: |
          INSTOCK_FLAG="--instock-only"
          if [ "${{ github.event.inputs.instock_only }}" = "false" ]; then
            INSTOCK_FLAG="--no-instock-only"
          fi
          DELAY="${{ github.event.inputs.delay_seconds || '2.0' }}"

          uv run lcsc-db scrape-lcsc --db-path lcsc_only.sqlite3 --delay "$DELAY" $INSTOCK_FLAG --include-raw-json --enable-fts --compress

      - name: Benchmark DB 2 (LCSC Only Variants Size)
        run: |
          uv run python scripts/benchmark_variants.py --db-path lcsc_only.sqlite3 --label "LCSC Only (DB 2)" --output-markdown "$GITHUB_STEP_SUMMARY"

      - name: "[Phase 2/2] Sync JLCPCB Component Database (Generate DB 1: JLCPCB Integrated)"
        run: |
          cp lcsc_only.sqlite3 lcsc.sqlite3
          uv run lcsc-db sync-jlcpcb --db-path lcsc.sqlite3 --enable-fts --compress

      - name: Benchmark DB 1 (JLCPCB Integrated Variants Size)
        run: |
          uv run python scripts/benchmark_variants.py --db-path lcsc.sqlite3 --label "JLCPCB Integrated (DB 1)" --output-markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload Database Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lcsc-databases
          path: |
            lcsc.sqlite3.tar.gz
            lcsc.sqlite3
            lcsc_only.sqlite3.tar.gz
            lcsc_only.sqlite3

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule'
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "LCSC Product Database (Latest)"
          body: |
            Automated LCSC Product Database build release.

            ### Download Links:
            - **JLCPCB Integrated DB (DB 1)**: `lcsc.sqlite3.tar.gz` (Full JLCPCB + LCSC catalog)
            - **LCSC Only DB (DB 2)**: `lcsc_only.sqlite3.tar.gz` (LCSC catalog only)

            Built at: ${{ github.event.repository.updated_at }}
          files: |
            lcsc.sqlite3.tar.gz
            lcsc_only.sqlite3.tar.gz
          make_latest: true
          overwrite: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
