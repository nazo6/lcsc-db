name: Update LCSC Product Database

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:
    inputs:
      delay_seconds:
        description: "Delay between API requests in seconds"
        required: false
        default: "2.0"
      instock_only:
        description: "Fetch in-stock products only (true/false)"
        required: false
        default: "true"

jobs:
  build-database:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Download existing database release asset (for cache / delta update)
        continue-on-error: true
        run: |
          gh release download latest -p "lcsc.sqlite3.tar.gz" || true
          if [ -f "lcsc.sqlite3.tar.gz" ]; then
            echo "Found existing database release archive. Decompressing..."
            tar -xzf lcsc.sqlite3.tar.gz
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run LCSC Database Scraper
        run: |
          INSTOCK_FLAG="--instock-only"
          if [ "${{ github.event.inputs.instock_only }}" = "false" ]; then
            INSTOCK_FLAG="--all-parts"
          fi
          DELAY="${{ github.event.inputs.delay_seconds || '2.0' }}"

          uv run lcsc-db --db-path lcsc.sqlite3 --delay "$DELAY" $INSTOCK_FLAG --max-duration 19800 --include-raw-json --enable-fts --compress

      - name: Upload Database Artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcsc-database
          path: |
            lcsc.sqlite3.tar.gz
            lcsc.sqlite3

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule'
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "LCSC Product Database (Latest)"
          body: |
            Automated LCSC Product Database build.
            - SQLite database compressed as `lcsc.sqlite3.tar.gz`
            - Built at: ${{ github.event.repository.updated_at }}
          files: |
            lcsc.sqlite3.tar.gz
          make_latest: true
          overwrite: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if scraping incomplete & trigger continuation workflow
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'schedule'
        run: |
          IS_INCOMPLETE=$(uv run python -c "
          from lcsc_db.db import LCSCDatabase
          with LCSCDatabase('lcsc.sqlite3') as db:
              print('true' if db.has_incomplete_progress() else 'false')
          ")
          if [ "$IS_INCOMPLETE" = "true" ]; then
            echo "::warning::Scraping was paused due to max execution duration. Triggering continuation workflow run..."
            gh workflow run update_database.yml
          else
            echo "Scraping completed fully across all categories."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
